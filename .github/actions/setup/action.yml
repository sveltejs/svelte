name: 'Setup'
description: 'Install pnpm, Node.js and the workspace dependencies'

inputs:
  node-version:
    description: 'The Node version to install'
    default: '24'

runs:
  using: 'composite'
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
